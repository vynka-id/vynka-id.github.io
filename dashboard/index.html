<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · Vynka</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navh:0px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:radial-gradient(900px 500px at 8% -5%,#e9d5ff,transparent 60%),radial-gradient(700px 500px at 100% 0%,#fde68a88,transparent 55%),radial-gradient(800px 600px at 50% 110%,#a7f3d088,transparent 60%),var(--bg)}
.side{background:var(--card);margin:14px;border-radius:28px;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:14px;height:calc(100vh - 28px);overflow-y:auto;border:1px solid var(--line);box-shadow:0 10px 40px -14px rgba(76,29,149,.3)}
.me{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font:800 22px Outfit,sans-serif;letter-spacing:-.5px}
.mini{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;display:grid;place-items:center;font-size:18px;transform:rotate(-6deg)}
.grp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 12px 4px}
.nav{background:none;border:0;text-align:left;padding:10px 14px;border-radius:14px;color:var(--text);font-weight:600;white-space:nowrap;transition:.15s}
.nav:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);transform:translateX(3px)}
.nav.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ec4899));color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.out{margin-top:auto;color:var(--muted)}
.main{padding:34px 34px 90px;max-width:1020px;width:100%}
.hd{margin-bottom:22px}.hd h1{font:800 34px/1.1 Outfit,sans-serif;letter-spacing:-1px}.hd p{margin:0}
.sec{font:700 22px Outfit,sans-serif;margin:30px 0 14px}
.panel{position:relative;overflow:hidden;border-radius:28px;padding:28px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#000),var(--accent) 45%,color-mix(in srgb,var(--accent) 55%,#f472b6));box-shadow:0 18px 40px -18px var(--accent)}
.panel::before,.panel::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.panel::before{width:200px;height:200px;right:-50px;top:-80px}.panel::after{width:120px;height:120px;right:150px;bottom:-60px}
.panel>*{position:relative;z-index:1}
.panel b{font:800 26px Outfit,sans-serif;word-break:break-all;display:block}
.panel .m{color:rgba(255,255,255,.85)}
.panel .b{background:#fff;color:#111827;box-shadow:none}
.panel a.g{border-color:rgba(255,255,255,.7);color:#fff!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:18px}
.stat{position:relative;border-radius:24px;padding:20px;overflow:hidden}
.stat b{font:800 42px Outfit,sans-serif;display:block;letter-spacing:-1.5px}
.stat .m{color:inherit;opacity:.75;font-weight:600}
.stat::after{position:absolute;right:14px;top:10px;font-size:28px}
.stats .stat:nth-child(1){background:#ede9fe;color:#4c1d95}.stats .stat:nth-child(1)::after{content:"👀"}
.stats .stat:nth-child(2){background:#d1fae5;color:#064e3b}.stats .stat:nth-child(2)::after{content:"👆"}
.stats .stat:nth-child(3){background:#ffedd5;color:#7c2d12}.stats .stat:nth-child(3)::after{content:"✨"}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tile{border:0;border-radius:24px;padding:20px 18px;text-align:left;font:700 16px 'Plus Jakarta Sans',sans-serif;color:#1f2937;transition:.18s}
.tile::before{display:block;font-size:30px;margin-bottom:10px}
.tile small{display:block;font-weight:500;opacity:.7;margin-top:2px}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tiles .tile:nth-child(1){background:#fef3c7}.tiles .tile:nth-child(1)::before{content:"🔗"}
.tiles .tile:nth-child(2){background:#fce7f3}.tiles .tile:nth-child(2)::before{content:"🙂"}
.tiles .tile:nth-child(3){background:#dbeafe}.tiles .tile:nth-child(3)::before{content:"🎨"}
.tiles .tile:nth-child(4){background:#dcfce7}.tiles .tile:nth-child(4)::before{content:"📱"}
.top3{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.bar1{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--accent),#ec4899);margin-top:8px;min-width:4px}
.box{border-radius:22px;box-shadow:0 8px 24px -16px rgba(0,0,0,.3)}
input{border-radius:12px}
.b{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ec4899));border-radius:999px;padding:11px 22px;box-shadow:0 8px 18px -10px var(--accent)}
.g{border-radius:12px}
.opt{border-radius:999px}
.edit{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
.prev{position:sticky;top:20px;border:8px solid #1e1b4b;border-radius:44px;padding:30px 16px 26px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card));box-shadow:0 24px 50px -20px rgba(30,27,75,.5)}
.prev .lk{padding:11px;font-size:14px;margin-top:9px}
.prev .av{width:64px;height:64px;font-size:26px}.prev h1{font-size:18px}.prev .bio{font-size:13px}
.sbar{position:sticky;bottom:var(--navh);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px -14px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){
  .shell{background:radial-gradient(900px 500px at 8% -5%,#4c1d9566,transparent 60%),radial-gradient(700px 500px at 100% 0%,#be185d33,transparent 55%),radial-gradient(800px 600px at 50% 110%,#0f766e44,transparent 60%),var(--bg)}
  .stats .stat:nth-child(1){background:#4c1d9566;color:#ddd6fe}.stats .stat:nth-child(2){background:#06503f77;color:#a7f3d0}.stats .stat:nth-child(3){background:#7c2d1266;color:#fed7aa}
  .tile{color:#f1f5f9}.tiles .tile:nth-child(1){background:#78350f66}.tiles .tile:nth-child(2){background:#83184366}.tiles .tile:nth-child(3){background:#1e3a8a66}.tiles .tile:nth-child(4){background:#14532d66}
}
@media (max-width:760px){
  :root{--navh:84px}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;margin:0;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;z-index:5;padding:8px;border-radius:24px}
  .me,.grp{display:none}.out{margin-top:0}
  .main{padding:22px 16px 130px}.hd h1{font-size:28px}
  .edit{grid-template-columns:1fr}.prev{display:none}
  .sbar{bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="app"><p class="m c" style="padding:40px">Memuat…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/vynka.js"></script>
<script>
const S={view:"beranda",p:null,prof:null,links:[],deleted:[],dirty:false,user:null};
const MENU=[["Utama",[["beranda","🏠 Beranda"],["link","🔗 Link"],["profil","🙂 Profil"],["tampilan","🎨 Tampilan"]]],["Bertumbuh",[["statistik","📊 Statistik"],["qr","📱 Kode QR"]]],["Akun",[["pengaturan","⚙️ Pengaturan"]]]];
window.onbeforeunload=e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } };
const sapa=()=>{const h=new Date().getHours();return h<11?"pagi":h<15?"siang":h<18?"sore":"malam";};
const pubUrl=()=>location.origin+"/"+S.p.username;
const totalKlik=()=>S.links.reduce((a,l)=>a+(l.clicks||0),0);
const T=(t,x={})=>el("div",{className:"m",textContent:t,...x});

async function salin(btn){
  try{ await navigator.clipboard.writeText(pubUrl()); const t=btn.textContent; btn.textContent="Tersalin ✓"; setTimeout(()=>btn.textContent=t,1800); }
  catch(e){ prompt("Salin link ini:",pubUrl()); }
}
async function keluar(){
  if(S.dirty && !confirm("Ada perubahan yang belum disimpan. Tetap keluar?")) return;
  S.dirty=false; await sb.auth.signOut(); location.replace("/");
}
function go(v){ S.view=v; history.replaceState(null,"","#"+v); render(); window.scrollTo(0,0); }

function shell(...main){
  const out=el("button",{className:"nav out",textContent:"🚪 Keluar"}); out.onclick=keluar;
  const nav=[]; MENU.forEach(([g,its])=>{ nav.push(el("div",{className:"grp",textContent:g})); its.forEach(([k,t])=>{ const b=el("button",{className:"nav"+(S.view===k?" on":""),textContent:t}); b.onclick=()=>go(k); nav.push(b); }); });
  app.replaceChildren(el("div",{className:"shell"},el("nav",{className:"side"},el("div",{className:"me"},el("span",{className:"mini",textContent:"V"}),el("span",{textContent:"Vynka"})),...nav,out),el("main",{className:"main"},...main)));
}
const hd=(j,s)=>el("div",{className:"hd"},el("h1",{textContent:j}),...(s?[T(s)]:[]));

function vBeranda(){
  const v=S.p.views||0, k=totalKlik(), top=[...S.links].sort((a,b)=>b.clicks-a.clicks).slice(0,3);
  const cp=el("button",{className:"b",textContent:"Salin link",style:"padding:9px 16px"}); cp.onclick=()=>salin(cp);
  const buka=el("a",{className:"g",textContent:"Buka halaman",href:pubUrl(),target:"_blank",style:"text-decoration:none;color:var(--text)"});
  const tile=(j,s,v)=>{ const b=el("button",{className:"tile"},j,el("small",{textContent:s})); b.onclick=()=>go(v); return b; };
  shell(hd("Selamat "+sapa()+", "+(S.prof.display_name||S.p.username)+" 👋","Ini ringkasan halaman Vynka kamu."),
    el("div",{className:"panel"},el("div",{},T("Alamat halaman kamu"),el("b",{textContent:location.host+"/"+S.p.username})),el("div",{className:"row"},cp,buka)),
    el("div",{className:"stats"},
      el("div",{className:"stat"},T("Pengunjung"),el("b",{textContent:String(v)})),
      el("div",{className:"stat"},T("Total klik"),el("b",{textContent:String(k)})),
      el("div",{className:"stat"},T("Rasio klik"),el("b",{textContent:v?Math.round(k/v*100)+"%":"–"}))),
    el("h2",{className:"sec",textContent:"Mulai cepat"}),
    el("div",{className:"tiles"},tile("Tambah link","Kelola daftar link","link"),tile("Lengkapi profil","Foto, bio, ikon sosial","profil"),tile("Ganti tampilan","Warna, font, bentuk tombol","tampilan"),tile("Kode QR","Untuk kartu atau poster","qr")),
    el("h2",{className:"sec",textContent:"Link terpopuler"}),
    ...(top.length?top.map(l=>el("div",{className:"top3"},el("span",{textContent:l.title}),T(l.clicks+" klik"))):[T("Belum ada link. Buka menu Link untuk menambahkan.")]));
}

function vStat(){
  const v=S.p.views, k=totalKlik(), max=Math.max(1,...S.links.map(l=>l.clicks||0));
  shell(hd("Statistik","Jumlah pengunjung dan klik seluruh waktu."),
    el("div",{className:"stats",style:"margin-top:0"},
      el("div",{className:"stat"},T("Pengunjung"),el("b",{textContent:String(v||0)})),
      el("div",{className:"stat"},T("Total klik"),el("b",{textContent:String(k)})),
      el("div",{className:"stat"},T("Rasio klik"),el("b",{textContent:v?Math.round(k/v*100)+"%":"–"}))),
    ...(v===undefined?[T("Pengunjung belum tercatat. Jalankan tambahan2.sql di Supabase.",{style:"margin-top:12px"})]:[]),
    el("h2",{className:"sec",textContent:"Klik per link"}),
    ...(S.links.length?S.links.map(l=>{ const b=el("div",{className:"bar1"}); b.style.width=Math.round((l.clicks||0)/max*100)+"%"; return el("div",{className:"top3",style:"flex-direction:column;gap:0"},el("div",{style:"display:flex;justify-content:space-between"},el("span",{textContent:l.title}),T(l.clicks+" klik")),b); }):[T("Belum ada link.")]));
}

function vQR(){
  const qrd=el("div",{style:"background:#fff;padding:14px;border-radius:12px;width:fit-content"});
  const dl=el("a",{className:"g",textContent:"Unduh PNG",download:"vynka-qr.png",style:"text-decoration:none;color:var(--text);width:fit-content"});
  shell(hd("Kode QR","Pindai untuk membuka halaman kamu. Cocok untuk kartu nama, stiker, atau poster."),el("div",{className:"box",style:"width:fit-content"},qrd,T(pubUrl()),dl));
  if(window.QRCode){ new QRCode(qrd,{text:pubUrl(),width:200,height:200}); setTimeout(()=>{ const c=qrd.querySelector("canvas"); if(c) dl.href=c.toDataURL("image/png"); },200); }
  else qrd.textContent="Pustaka QR gagal dimuat. Muat ulang halaman.";
}

async function simpan(save,status){
  const L=S.links;
  if(L.some(l=>!l.title.trim()||!l.url.trim()||l.url.trim()==="https://")){ status.textContent="Isi judul dan URL semua link, atau hapus yang kosong."; return; }
  save.disabled=true; status.textContent="Menyimpan…";
  try{
    const f=S.prof; let r=await sb.from("profiles").update({display_name:f.display_name,bio:f.bio,theme:f.theme,font:f.font,btn_style:f.btn_style,avatar_url:f.avatar_url||null,socials:f.socials}).eq("id",S.user.id); if(r.error) throw r.error;
    if(S.deleted.length){ r=await sb.from("links").delete().in("id",S.deleted); if(r.error) throw r.error; S.deleted=[]; }
    const lama=L.map((l,i)=>({l,i})).filter(x=>x.l.id);
    if(lama.length){ const hs=await Promise.all(lama.map(x=>sb.from("links").update({title:x.l.title.trim(),url:x.l.url.trim(),position:x.i}).eq("id",x.l.id))); const bad=hs.find(h=>h.error); if(bad) throw bad.error; }
    const baru=L.map((l,i)=>({l,i})).filter(x=>!x.l.id);
    if(baru.length){ r=await sb.from("links").insert(baru.map(x=>({user_id:S.user.id,title:x.l.title.trim(),url:x.l.url.trim(),position:x.i}))).select(); if(r.error) throw r.error; r.data.forEach((row,k)=>{ baru[k].l.id=row.id; }); }
    S.dirty=false; S.p={...S.p,...f}; status.textContent="Tersimpan ✓ Perubahan sudah tampil di halaman publik.";
  }catch(e){ status.textContent="Gagal menyimpan: "+(e.message||e); }
  save.disabled=false;
}

// Kerangka halaman edit: kolom kiri + pratinjau kanan + tombol simpan
function editor(judul,sub,build){
  const status=T("",{style:"min-height:1.4em"}), pvBox=el("div"), prev=el("div",{className:"prev"},pvBox);
  const pv=()=>renderPublik(pvBox,{...S.p,...S.prof},S.links,{preview:true});
  const mark=()=>{ S.dirty=true; status.textContent="Ada perubahan yang belum disimpan."; pv(); };
  const save=el("button",{className:"b",textContent:"Simpan perubahan"}); save.onclick=()=>simpan(save,status);
  const {cols,extra}=build(mark);
  pv();
  shell(hd(judul,sub),el("div",{className:"edit"},el("div",{},...cols,el("div",{className:"sbar"},status,el("div",{className:"row"},...(extra||[]),el("div",{style:"flex:1"}),save))),prev));
}

function vLink(){
  editor("Link","Tambah, ubah, dan atur urutan link kamu.",mark=>{
    const box=el("div");
    const gambar=()=>box.replaceChildren(...S.links.map((l,i)=>{
      const t=el("input",{value:l.title,placeholder:"Judul, contoh: Instagram"}), u=el("input",{value:l.url,placeholder:"https://..."});
      t.oninput=()=>{ l.title=t.value; mark(); }; u.oninput=()=>{ l.url=u.value; mark(); };
      const up=el("button",{className:"g",textContent:"↑",title:"Naik"}), dn=el("button",{className:"g",textContent:"↓",title:"Turun"}), del=el("button",{className:"g",textContent:"✕",title:"Hapus"});
      up.onclick=()=>{ if(i>0){ [S.links[i-1],S.links[i]]=[S.links[i],S.links[i-1]]; mark(); gambar(); } };
      dn.onclick=()=>{ if(i<S.links.length-1){ [S.links[i+1],S.links[i]]=[S.links[i],S.links[i+1]]; mark(); gambar(); } };
      del.onclick=()=>{ if(l.id) S.deleted.push(l.id); S.links.splice(i,1); mark(); gambar(); };
      return el("div",{className:"box"},el("div",{className:"row"},el("div",{className:"f"},t,u),up,dn,del),T(l.clicks+" klik"));
    }));
    gambar();
    const add=el("button",{className:"g",textContent:"+ Tambah link"});
    add.onclick=()=>{ S.links.push({title:"",url:"",clicks:0}); mark(); gambar(); const ins=box.querySelectorAll("input"); if(ins.length>1) ins[ins.length-2].focus(); };
    return {cols:[box],extra:[add]};
  });
}

function vProfil(){
  editor("Profil","Nama, bio, foto, dan ikon sosial yang tampil di halaman kamu.",mark=>{
    const f=S.prof, inp=(k,ph,max)=>{ const i=el("input",{value:f[k]||"",placeholder:ph,maxLength:max}); i.oninput=()=>{ f[k]=i.value; mark(); }; return i; };
    const soc=Object.keys(SOSIAL).map(k=>{ const i=el("input",{value:f.socials[k]||"",placeholder:k==="email"?"nama@email.com":k==="whatsapp"?"628123456789":"Link "+SOSIAL[k]}); i.oninput=()=>{ if(i.value.trim()) f.socials[k]=i.value; else delete f.socials[k]; mark(); }; return el("div",{className:"row"},el("span",{className:"m",style:"width:88px",textContent:SOSIAL[k]}),i); });
    return {cols:[el("div",{className:"box"},T("Nama"),inp("display_name","Nama",40),T("Bio"),inp("bio","Bio singkat",120),T("Foto profil (link gambar https://...)"),inp("avatar_url","https://contoh.com/foto.jpg",300)),el("h2",{className:"sec",textContent:"Ikon sosial"}),el("div",{className:"box"},...soc)]};
  });
}

function pilihan(key,opsi,mark,gaya){
  const w=el("div",{className:"sw"});
  const tampil=()=>w.replaceChildren(...Object.entries(opsi).map(([v,t])=>{ const b=el("button",{className:"opt"+(S.prof[key]===v?" on":""),textContent:t}); if(gaya) b.style.fontFamily=gaya(v); b.onclick=()=>{ S.prof[key]=v; mark(); tampil(); }; return b; }));
  tampil(); return w;
}
function vTampilan(){
  editor("Tampilan","Atur warna, font, dan bentuk tombol halaman kamu.",mark=>{
    const f=S.prof;
    const sw=el("div",{className:"sw"},...Object.keys(WARNA).map(k=>{ const b=el("button",{title:k}); b.style.background=WARNA[k]; b.onclick=()=>{ f.theme=k; setTheme(k); mark(); col.value=WARNA[k]; }; return b; }));
    const col=el("input",{type:"color",value:hexOf(f.theme),title:"Warna sendiri"}); col.oninput=()=>{ f.theme=col.value; setTheme(col.value); mark(); }; sw.append(col);
    return {cols:[el("div",{className:"box"},T("Warna utama"),sw,T("Font",{style:"margin-top:8px"}),pilihan("font",FONT_NAMA,mark,v=>FONTS[v]),T("Bentuk tombol",{style:"margin-top:8px"}),pilihan("btn_style",{bulat:"Bulat",kotak:"Kotak",pil:"Pil",isi:"Berwarna"},mark))]};
  });
}

function vPengaturan(){
  const un=el("input",{value:S.p.username,maxLength:30}), pw=el("input",{type:"password",placeholder:"Kata sandi baru (min. 6 karakter)",autocomplete:"new-password"});
  const m1=T(""), m2=T(""), b1=el("button",{className:"b",textContent:"Ganti username"}), b2=el("button",{className:"b",textContent:"Ganti kata sandi"});
  b1.onclick=async()=>{
    const u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,30}$/.test(u)) return m1.textContent="Username 3–30 karakter: huruf kecil, angka, atau _.";
    if(RESERVED.includes(u)) return m1.textContent="Username ini dicadangkan. Pilih yang lain.";
    if(u===S.p.username) return m1.textContent="Username belum berubah.";
    if(!confirm("Link lama "+location.host+"/"+S.p.username+" akan berhenti berfungsi. Lanjutkan?")) return;
    const {error}=await sb.from("profiles").update({username:u}).eq("id",S.user.id);
    if(error) return m1.textContent=error.code==="23505"?"Username sudah dipakai.":error.message;
    S.p.username=u; m1.textContent="Berhasil. Link baru: "+location.host+"/"+u;
  };
  b2.onclick=async()=>{
    if(pw.value.length<6) return m2.textContent="Minimal 6 karakter.";
    const {error}=await sb.auth.updateUser({password:pw.value});
    m2.textContent=error?error.message:"Kata sandi berhasil diganti."; if(!error) pw.value="";
  };
  shell(hd("Pengaturan","Kelola akun kamu."),
    el("div",{className:"box"},el("b",{textContent:"Username"}),T("Menentukan alamat halaman publik kamu."),un,m1,b1),
    el("div",{className:"box"},el("b",{textContent:"Kata sandi"}),T("Email akun: "+S.user.email),pw,m2,b2));
}

function render(){ ({beranda:vBeranda,link:vLink,profil:vProfil,tampilan:vTampilan,statistik:vStat,qr:vQR,pengaturan:vPengaturan}[S.view]||vBeranda)(); }

function buatProfil(){
  const un=el("input",{placeholder:"username (huruf kecil, angka, _)",maxLength:30}), err=el("div",{className:"err"}), btn=el("button",{className:"b",textContent:"Buat halaman"});
  btn.onclick=async()=>{
    const u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,30}$/.test(u)){ err.textContent="Username 3–30 karakter: huruf kecil, angka, atau _."; return; }
    if(RESERVED.includes(u)){ err.textContent="Username ini dicadangkan. Pilih yang lain."; return; }
    const {error}=await sb.from("profiles").insert({id:S.user.id,username:u,display_name:u});
    if(error){ err.textContent=error.code==="23505"?"Username sudah dipakai.":error.message; return; }
    muat();
  };
  app.replaceChildren(el("div",{className:"wrap"},el("h1",{textContent:"Pilih username"}),T("Ini akan jadi alamat halaman kamu: "+location.host+"/username"),el("div",{className:"box"},un,err,btn)));
}

async function muat(){
  const {data:p}=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();
  if(!p) return buatProfil();
  const {data:ls}=await sb.from("links").select("*").eq("user_id",S.user.id).order("position");
  S.p=p; S.prof={display_name:p.display_name||"",bio:p.bio||"",theme:p.theme||"hijau",font:p.font||"jakarta",btn_style:p.btn_style||"bulat",avatar_url:p.avatar_url||"",socials:{...(p.socials||{})}};
  S.links=(ls||[]).map(l=>({id:l.id,title:l.title,url:l.url,clicks:l.clicks})); S.deleted=[]; S.dirty=false;
  setTheme(S.prof.theme);
  const h=location.hash.slice(1); S.view=MENU.flatMap(g=>g[1]).some(x=>x[0]===h)?h:"beranda";
  render();
}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace("/"); return; }
  S.user=session.user; muat();
})();
</script>
