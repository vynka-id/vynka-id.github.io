<style>
:root{--navh:0px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:radial-gradient(900px 500px at 8% -5%,#e9d5ff,transparent 60%),radial-gradient(700px 500px at 100% 0%,#fde68a88,transparent 55%),radial-gradient(800px 600px at 50% 110%,#a7f3d088,transparent 60%),var(--bg)}
.side{background:var(--card);margin:14px;border-radius:28px;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:14px;height:calc(100vh - 28px);overflow-y:auto;border:1px solid var(--line);box-shadow:0 10px 40px -14px rgba(76,29,149,.3)}
.me{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font:800 22px Outfit,sans-serif;letter-spacing:-.5px}
.mini{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;display:grid;place-items:center;font-size:18px;transform:rotate(-6deg)}
.grp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 12px 4px}
.nav{background:none;border:0;text-align:left;padding:10px 14px;border-radius:14px;color:var(--text);font-weight:600;white-space:nowrap;transition:.15s}
.nav:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);transform:translateX(3px)}
.nav.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ec4899));color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.lsw{margin-top:auto;padding:10px 6px}.out{color:var(--muted)}
.side .lang{background:#1b2640;border-color:#2b3858}.side .lang button{color:#9fb0cf}.side .lang button.on{color:#fff}
.main{padding:34px 34px 90px;max-width:1020px;width:100%}
.hd{margin-bottom:22px}.hd h1{font:800 34px/1.1 Outfit,sans-serif;letter-spacing:-1px}.hd p{margin:0}
.sec{font:700 22px Outfit,sans-serif;margin:30px 0 14px}
.panel{position:relative;overflow:hidden;border-radius:28px;padding:28px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#000),var(--accent) 45%,color-mix(in srgb,var(--accent) 55%,#f472b6));box-shadow:0 18px 40px -18px var(--accent)}
.panel::before,.panel::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.panel::before{width:200px;height:200px;right:-50px;top:-80px}.panel::after{width:120px;height:120px;right:150px;bottom:-60px}

.panel .m{color:rgba(255,255,255,.85)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:18px}
.stat{position:relative;border-radius:24px;padding:20px;overflow:hidden}
.stat b{font:800 42px Outfit,sans-serif;display:block;letter-spacing:-1.5px}
.stat .m{color:inherit;opacity:.75;font-weight:600}
.stat::after{position:absolute;right:14px;top:10px;font-size:28px}
.stats .stat:nth-child(1){background:#ede9fe;color:#4c1d95}.stats .stat:nth-child(1)::after{content:"👀"}
.stats .stat:nth-child(2){background:#d1fae5;color:#064e3b}.stats .stat:nth-child(2)::after{content:"👆"}
.stats .stat:nth-child(3){background:#ffedd5;color:#7c2d12}.stats .stat:nth-child(3)::after{content:"✨"}

.tile::before{display:block;font-size:30px;margin-bottom:10px}

.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tiles .tile:nth-child(1){background:#fef3c7}.tiles .tile:nth-child(1)::before{content:"🔗"}

.ci{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;color:var(--text);width:100%;text-align:left;font-weight:600}
.ci b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}

.sch{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sch input{width:auto;flex:1;min-width:150px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tt{border:3px solid var(--line);border-radius:16px;padding:10px 10px 12px;background:var(--pbg);color:var(--ptext);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}

.tt .tn{font-weight:700;font-size:13px}

  .shell{background:radial-gradient(900px 500px at 8% -5%,#4c1d9566,transparent 60%),radial-gradient(700px 500px at 100% 0%,#be185d33,transparent 55%),radial-gradient(800px 600px at 50% 110%,#0f766e44,transparent 60%),var(--bg)}
  .stats .stat:nth-child(1){background:#4c1d9566;color:#ddd6fe}.stats .stat:nth-child(2){background:#06503f77;color:#a7f3d0}.stats .stat:nth-child(3){background:#7c2d1266;color:#fed7aa}

}

  .me,.grp,.lsw{display:none}
  .main{padding:22px 16px 130px}.hd h1{font-size:28px}
  .edit{grid-template-columns:1fr}.prev{display:none}
  .sbar{bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
}

async function loadEv(){
  const since=new Date(Date.now()-30*864e5).toISOString();
  const r=await sb.from("events").select("type,created_at,ref,device,link_id").eq("user_id",S.user.id).gte("created_at",since).order("created_at",{ascending:false}).limit(5000);

function chartSvg(days){
  const out=[], now=new Date();
  for(let i=days-1;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); out.push({k:lk_(d),v:0,c:0}); }
  const m=Object.fromEntries(out.map(o=>[o.k,o]));
  (S.ev||[]).forEach(e=>{ const o=m[lk_(new Date(e.created_at))]; if(o){ if(e.type==="view") o.v++; else o.c++; } });
  const W=640,H=180,P=24,mx=Math.max(1,...out.map(x=>Math.max(x.v,x.c))),bw=(W-P)/out.length,w=Math.max(2,bw*.36);

function kecil(file,maks=900){
  return new Promise((ok,gagal)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const r=Math.min(1,maks/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):gagal(new Error(L("Gagal memproses gambar"))),"image/jpeg",0.85); };
    img.onerror=()=>gagal(new Error(L("File bukan gambar yang valid"))); img.src=u;
  });
}

function fotoPicker({url,huruf,ukuran,bulat,maks,pre,onChange}){
  const lab=el("label",{className:"fp"+(bulat?" round":""),title:L("Klik atau seret foto ke sini")});

  const isi=el("span",{className:"fpi"}), cam=el("span",{className:"fpc",textContent:"📷"});
  const x=el("button",{className:"fpx",textContent:"✕",title:L("Hapus foto"),type:"button"});

  const kirim=async fl=>{

    if(fl.size>10*1024*1024) return alert(L("File terlalu besar (maks 10 MB)."));

    try{

      const r=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"}); if(r.error) throw r.error;

  ["dragleave","drop"].forEach(ev=>lab.addEventListener(ev,e=>{ e.preventDefault(); lab.classList.remove("drag"); }));

}

function vPengaturan(){
  const un=el("input",{value:S.p.username,maxLength:30}), pw=el("input",{type:"password",placeholder:L("Kata sandi baru (min. 6 karakter)"),autocomplete:"new-password"});
  const m1=T(""), m2=T(""), b1=el("button",{className:"b",textContent:L("Ganti username")}), b2=el("button",{className:"b",textContent:L("Ganti kata sandi")});
  b1.onclick=async()=>{
    const u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,30}$/.test(u)) return m1.textContent=L("Username 3–30 karakter: huruf kecil, angka, atau _.");
    if(RESERVED.includes(u)) return m1.textContent=L("Username ini dicadangkan. Pilih yang lain.");
    if(u===S.p.username) return m1.textContent=L("Username belum berubah.");
    if(!confirm(L("Link lama ")+location.host+"/"+S.p.username+L(" akan berhenti berfungsi. Lanjutkan?"))) return;
    const {error}=await sb.from("profiles").update({username:u}).eq("id",S.user.id);
    if(error) return m1.textContent=error.code==="23505"?L("Username sudah dipakai."):error.message;
    S.p.username=u; m1.textContent=L("Berhasil. Link baru: ")+location.host+"/"+u;
  };
  b2.onclick=async()=>{
    if(pw.value.length<6) return m2.textContent=L("Minimal 6 karakter.");
    const {error}=await sb.auth.updateUser({password:pw.value});
    m2.textContent=error?error.message:L("Kata sandi berhasil diganti."); if(!error) pw.value="";
  };
  shell(hd(L("Pengaturan"),L("Kelola akun kamu.")),
    el("div",{className:"box"},el("b",{textContent:"Username"}),T(L("Menentukan alamat halaman publik kamu.")),un,m1,b1),
    el("div",{className:"box"},el("b",{textContent:L("Bahasa")}),T(L("Pilih bahasa tampilan dashboard.")),langSw()),
    el("div",{className:"box"},el("b",{textContent:L("Kata sandi")}),T(L("Email akun: ")+S.user.email),pw,m2,b2));
}

function buatProfil(){
  const un=el("input",{placeholder:L("username (huruf kecil, angka, _)"),maxLength:30,value:sessionStorage.getItem("vynka_un")||""}), err=el("div",{className:"err"}), btn=el("button",{className:"b",textContent:L("Buat halaman")});
  btn.onclick=async()=>{
    const u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,30}$/.test(u)){ err.textContent=L("Username 3–30 karakter: huruf kecil, angka, atau _."); return; }
    if(RESERVED.includes(u)){ err.textContent=L("Username ini dicadangkan. Pilih yang lain."); return; }
    const {error}=await sb.from("profiles").insert({id:S.user.id,username:u,display_name:u});
    if(error){ err.textContent=error.code==="23505"?L("Username sudah dipakai."):error.message; return; }
    muat();
  };
  app.replaceChildren(el("div",{className:"wrap"},el("h1",{textContent:L("Pilih username")}),T(L("Ini akan jadi alamat halaman kamu: ")+location.host+"/username"),el("div",{className:"box"},un,err,btn)));
}

async function muat(){
  const {data:p}=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();
  if(!p) return buatProfil();
  const {data:ls}=await sb.from("links").select("*").eq("user_id",S.user.id).order("position");
  S.p=p; S.prof={display_name:p.display_name||"",bio:p.bio||"",theme:p.theme||"hijau",font:p.font||"jakarta",btn_style:p.btn_style||"bulat",tema:TEMA[p.tema]?p.tema:"klasik",layout:p.layout==="cover"?"cover":"standar",avatar_url:p.avatar_url||"",bg_mode:p.bg_mode||"tema",bg_a:p.bg_a||"#111827",bg_b:p.bg_b||"#7c3aed",bg_image:p.bg_image||"",seo_title:p.seo_title||"",seo_desc:p.seo_desc||"",collect_email:!!p.collect_email,email_title:p.email_title||"",socials:{...(p.socials||{})}};
  S.links=(ls||[]).map(l=>({id:l.id,title:l.title,url:l.url,image_url:l.image_url||"",clicks:l.clicks,kind:l.kind||"link",active:l.active!==false,starts_at:l.starts_at||null,ends_at:l.ends_at||null,...waParse(l)})); S.deleted=[]; S.dirty=false;
  setTheme(S.prof.theme);
  const h=location.hash.slice(1); S.view=MENU.flatMap(g=>g[1]).some(x=>x[0]===h)?h:"beranda";
  await loadEv();
  render();
}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace("/"); return; }
  S.user=session.user; muat();
})();
