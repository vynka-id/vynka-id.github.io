<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · Vynka</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app"><p class="m c">Memuat…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/vynka.js"></script>
<script>
function buatProfil(user){
  const un=el("input",{placeholder:"username (huruf kecil, angka, _)",maxLength:30});
  const err=el("div",{className:"err"});
  const btn=el("button",{className:"b",textContent:"Buat halaman"});
  btn.onclick=async()=>{
    const u=un.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,30}$/.test(u)){ err.textContent="Username 3–30 karakter: huruf kecil, angka, atau _."; return; }
    if(RESERVED.includes(u)){ err.textContent="Username ini dicadangkan. Pilih yang lain."; return; }
    const {error}=await sb.from("profiles").insert({id:user.id,username:u,display_name:u});
    if(error){ err.textContent=error.code==="23505"?"Username sudah dipakai.":error.message; return; }
    dash(user);
  };
  app.replaceChildren(el("h1",{textContent:"Pilih username"}), el("p",{className:"m",textContent:"Ini akan jadi alamat halaman kamu: "+location.host+"/username"}), el("div",{className:"box"},un,err,btn));
}

async function dash(user){
  const {data:p}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!p) return buatProfil(user);
  const {data:ls}=await sb.from("links").select("*").eq("user_id",user.id).order("position");
  const prof={display_name:p.display_name||"",bio:p.bio||"",theme:p.theme||"hijau"};
  let links=(ls||[]).map(l=>({id:l.id,title:l.title,url:l.url,clicks:l.clicks}));
  let deleted=[], dirty=false;
  setTheme(prof.theme);
  window.onbeforeunload=e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } };

  const status=el("div",{className:"m",style:"min-height:1.4em"});
  const mark=()=>{ dirty=true; status.textContent="Ada perubahan yang belum disimpan."; };
  const url=location.origin+"/"+p.username;

  const out=el("button",{className:"g",textContent:"Keluar"});
  out.onclick=async()=>{ if(dirty && !confirm("Ada perubahan yang belum disimpan. Tetap keluar?")) return; dirty=false; await sb.auth.signOut(); location.replace("/"); };

  const nm=el("input",{value:prof.display_name,placeholder:"Nama",maxLength:40});
  const bi=el("input",{value:prof.bio,placeholder:"Bio singkat",maxLength:120});
  nm.oninput=()=>{ prof.display_name=nm.value; mark(); };
  bi.oninput=()=>{ prof.bio=bi.value; mark(); };
  const sw=el("div",{className:"sw"}, ...Object.keys(WARNA).map(k=>{
    const b=el("button",{title:k}); b.style.background=WARNA[k];
    b.onclick=()=>{ prof.theme=k; setTheme(k); mark(); }; return b;
  }));

  const listBox=el("div");
  function gambar(){
    listBox.replaceChildren(...links.map((l,i)=>{
      const t=el("input",{value:l.title,placeholder:"Judul, contoh: Instagram"}), u=el("input",{value:l.url,placeholder:"https://..."});
      t.oninput=()=>{ l.title=t.value; mark(); }; u.oninput=()=>{ l.url=u.value; mark(); };
      const up=el("button",{className:"g",textContent:"↑",title:"Naik"}), dn=el("button",{className:"g",textContent:"↓",title:"Turun"}), del=el("button",{className:"g",textContent:"✕",title:"Hapus"});
      up.onclick=()=>{ if(i>0){ [links[i-1],links[i]]=[links[i],links[i-1]]; mark(); gambar(); } };
      dn.onclick=()=>{ if(i<links.length-1){ [links[i+1],links[i]]=[links[i],links[i+1]]; mark(); gambar(); } };
      del.onclick=()=>{ if(l.id) deleted.push(l.id); links.splice(i,1); mark(); gambar(); };
      return el("div",{className:"box"}, el("div",{className:"row"}, el("div",{className:"f"},t,u), up,dn,del), el("span",{className:"m",textContent:l.clicks+" klik"}));
    }));
  }
  gambar();

  const add=el("button",{className:"g",textContent:"+ Tambah link"});
  add.onclick=()=>{ links.push({title:"",url:"",clicks:0}); mark(); gambar(); const ins=listBox.querySelectorAll("input"); if(ins.length>1) ins[ins.length-2].focus(); };

  const save=el("button",{className:"b",textContent:"Simpan perubahan"});
  save.onclick=async()=>{
    if(links.some(l=>!l.title.trim()||!l.url.trim()||l.url.trim()==="https://")){ status.textContent="Isi judul dan URL semua link, atau hapus yang kosong."; return; }
    save.disabled=true; status.textContent="Menyimpan…";
    try{
      let r=await sb.from("profiles").update({display_name:prof.display_name,bio:prof.bio,theme:prof.theme}).eq("id",user.id); if(r.error) throw r.error;
      if(deleted.length){ r=await sb.from("links").delete().in("id",deleted); if(r.error) throw r.error; deleted=[]; }
      const lama=links.map((l,i)=>({l,i})).filter(x=>x.l.id);
      if(lama.length){ r=await sb.from("links").upsert(lama.map(x=>({id:x.l.id,user_id:user.id,title:x.l.title.trim(),url:x.l.url.trim(),position:x.i}))); if(r.error) throw r.error; }
      const baru=links.map((l,i)=>({l,i})).filter(x=>!x.l.id);
      if(baru.length){ r=await sb.from("links").insert(baru.map(x=>({user_id:user.id,title:x.l.title.trim(),url:x.l.url.trim(),position:x.i}))).select(); if(r.error) throw r.error; r.data.forEach((row,k)=>{ baru[k].l.id=row.id; }); }
      dirty=false; status.textContent="Tersimpan ✓ Perubahan sudah tampil di halaman publik.";
    }catch(e){ status.textContent="Gagal menyimpan: "+(e.message||e); }
    save.disabled=false;
  };

  const bar=el("div",{style:"position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;flex-direction:column;gap:8px"}, status, el("div",{className:"row"}, add, el("div",{style:"flex:1"}), save));

  app.replaceChildren(
    el("div",{className:"top"}, el("h1",{textContent:"Dashboard"}), out),
    el("p",{className:"m"}, "Halaman publik kamu: ", el("a",{className:"pub",href:url,target:"_blank",textContent:url})),
    el("h2",{textContent:"Profil"}), el("div",{className:"box"},nm,bi,el("span",{className:"m",textContent:"Warna tema"}),sw),
    el("h2",{textContent:"Link"}), listBox, bar
  );
}

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace("/"); return; }
  dash(session.user);
})();
</script>
</body>
</html>
