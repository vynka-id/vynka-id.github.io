
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - VYNKA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1c;color:#fff;font-family:Arial,sans-serif}
header{height:70px;border-bottom:1px solid #263550;display:flex;
align-items:center;justify-content:space-between;padding:0 5%}
.logo{font-size:25px;font-weight:800;letter-spacing:2px;color:#65d8ff}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;
font-weight:bold;background:#42c8f5;color:#07111e}
button.secondary{background:#263550;color:#fff}
button.danger{background:#512b38;color:#ffb8c5}
button:disabled{opacity:.5;cursor:wait}
main{max-width:1100px;margin:35px auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
h1{font-size:27px;margin:0 0 8px}
.muted{color:#9eacc2;font-size:14px;line-height:1.5}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}
.panel{background:#111b30;border:1px solid #263550;border-radius:14px;padding:23px}
h2{font-size:18px;margin:0 0 20px}
label{display:block;font-size:13px;color:#cbd5e1;margin:16px 0 7px}
input,textarea,select{width:100%;padding:12px;border-radius:8px;
border:1px solid #34445e;background:#091426;color:#fff;font:inherit}
textarea{min-height:95px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:1px solid #42c8f5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
#message{margin:18px 0;padding:12px;border-radius:8px;
font-size:14px;display:none;overflow-wrap:anywhere}
.link-item{border:1px solid #34445e;background:#0b1528;
border-radius:9px;padding:13px;margin-top:10px}
.link-title{font-weight:bold;overflow-wrap:anywhere}
.link-url{font-size:12px;color:#9eacc2;overflow-wrap:anywhere;margin-top:5px}
.link-actions{display:flex;gap:7px;margin-top:12px}
.link-actions button{padding:8px 11px;font-size:12px}
.empty{padding:22px;text-align:center;color:#9eacc2;
border:1px dashed #34445e;border-radius:9px;font-size:14px}
.preview{margin-top:20px}
.preview a{color:#65d8ff;overflow-wrap:anywhere}
@media(max-width:750px){.layout{grid-template-columns:1fr}main{margin-top:25px}}
</style>
</head>
<body>
<header>
  <div class="logo">VYNKA.</div>
  <button class="secondary" id="logoutBtn">Logout</button>
</header>

<main>
  <div class="top">
    <div>
      <h1>Dashboard</h1>
      <div class="muted">Kelola identitas digital VYNKA kamu.</div>
    </div>
    <div class="muted" id="accountEmail"></div>
  </div>

  <div id="message"></div>

  <div class="layout">
    <section class="panel">
      <h2>Profil Saya</h2>

      <form id="profileForm">
        <label>Nama tampilan</label>
        <input id="displayName" maxlength="60" required>

        <label>Username</label>
        <input id="username" maxlength="30"
          pattern="[a-z0-9-]{3,30}" required>
        <div class="muted">Huruf kecil, angka, dan tanda hubung. Minimal 3 karakter.</div>

        <label>Kategori</label>
        <input id="category" maxlength="60" placeholder="Contoh: Creator · Gaming">

        <label>Bio</label>
        <textarea id="bio" maxlength="300" placeholder="Ceritakan sedikit tentang dirimu..."></textarea>

        <label>URL foto profil</label>
        <input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp">

        <div id="avatarPreview" style="margin-top:12px">
          Belum ada foto profil.
        </div>

        <div class="actions">
          <button id="saveProfileBtn" type="submit">Simpan Profil</button>
          <button class="secondary" type="button" id="previewBtn">Lihat Profil</button>
        </div>
      </form>

      <div class="preview muted" id="profilePreview"></div>
    </section>

    <section class="panel">
      <h2>My Links</h2>
      <form id="linkForm">
        <label>Nama tautan</label>
        <input id="linkTitle" maxlength="80" placeholder="Contoh: TikTok" required>

        <label>URL tujuan</label>
        <input id="linkUrl" type="url" placeholder="https://..." required>

        <div class="actions">
          <button id="saveLinkBtn" type="submit">Tambah Link</button>
          <button class="secondary" type="button" id="cancelEditBtn" style="display:none">Batal</button>
        </div>
      </form>

      <div id="linksList" style="margin-top:20px">
        <div class="empty">Memuat tautan...</div>
      </div>
    </section>
  </div>
</main>

<script>
const SUPABASE_URL = "https://oasivryuvwpzxezrngej.supabase.co";
const SUPABASE_KEY = "sb_publishable_OyWy9aYFSJolvJxNcucMXA_bWPS2N-a";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let editingLinkId = null;
let currentLinks = [];

const $ = id => document.getElementById(id);

function showMessage(text, type = "success") {
  const box = $("message");
  box.style.display = "block";
  box.style.background = type === "error" ? "#512b38" : "#123b38";
  box.style.color = type === "error" ? "#ffcad3" : "#b8ffe9";
  box.textContent = text;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[char]);
}

function validHttpUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:";
  } catch {
    return false;
  }
}

async function init() {
  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {
    window.location.replace("/login/");
    return;
  }

  currentUser = data.session.user;
  $("accountEmail").textContent = currentUser.email || "";

  await loadDashboard();
}

async function loadDashboard() {
  const { data: profile, error: profileError } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (profileError) {
    showMessage("Gagal memuat profil: " + profileError.message, "error");
    return;
  }

  $("displayName").value = profile.display_name || "";
  $("username").value = profile.username || "";
  $("category").value = profile.category || "";
  $("bio").value = profile.bio || "";
  $("avatarUrl").value = profile.avatar_url || "";
  updateAvatarPreview(profile.avatar_url || "");

  updatePreview();
  if (!url) {
    box.innerHTML = "Belum ada foto profil.";
    return;
  }

  box.innerHTML = `
    <img
      src="${escapeHTML(url)}"
      alt="Foto profil"
      style="
        width:110px;
        height:110px;
        object-fit:cover;
        border-radius:50%;
        border:2px solid #42c8f5;
      "
    >
  `;
}

  const { data: links, error: linksError } = await db
    .from("links")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("position", { ascending: true })
    .order("created_at", { ascending: true });

  if (linksError) {
    showMessage("Gagal memuat tautan: " + linksError.message, "error");
    return;
  }

  currentLinks = links || [];
  renderLinks();
}

function updatePreview() {
  const username = $("username").value.trim();
  const url = username ? `https://vynka-id.github.io/${encodeURIComponent(username)}/` : "";
  $("profilePreview").textContent = "URL profil: " + (url || "Belum diisi");
}

function updateAvatarPreview(url) {
  const box = document.getElementById("avatarPreview");

  if (!url) {
    box.innerHTML = "Belum ada foto profil.";
    return;
  }

  box.innerHTML = `
    <img
      src="${url}"
      alt="Foto profil"
      style="
        width:110px;
        height:110px;
        object-fit:cover;
        border-radius:50%;
        border:2px solid #42c8f5;
      "
    >
  `;
}
$("username").addEventListener("input", updatePreview);

$("profileForm").addEventListener("submit", async event => {
  event.preventDefault();

  const username = $("username").value.trim().toLowerCase();
  const displayName = $("displayName").value.trim();
  const category = $("category").value.trim();
  const bio = $("bio").value.trim();
  const avatarUrl = $("avatarUrl").value.trim();

  if (!/^[a-z0-9-]{3,30}$/.test(username)) {
    showMessage("Username harus 3–30 karakter, hanya huruf kecil, angka, dan tanda hubung.", "error");
    return;
  }

  if (avatarUrl && !validHttpUrl(avatarUrl)) {
    showMessage("URL foto harus menggunakan http atau https.", "error");
    return;
  }

  const button = $("saveProfileBtn");
  button.disabled = true;
  button.textContent = "Menyimpan...";

  const { error } = await db
    .from("profiles")
    .update({
      username,
      display_name: displayName,
      category,
      bio,
      avatar_url: avatarUrl || null,
      updated_at: new Date().toISOString()
    })
    .eq("id", currentUser.id);

  button.disabled = false;
  button.textContent = "Simpan Profil";

  if (error) {
    showMessage(
      error.code === "23505"
        ? "Username tersebut sudah digunakan. Pilih username lain."
        : "Gagal menyimpan profil: " + error.message,
      "error"
    );
    return;
  }

  showMessage("Profil berhasil disimpan!");
  updatePreview();
});

function renderLinks() {
  const list = $("linksList");

  if (!currentLinks.length) {
    list.innerHTML = '<div class="empty">Belum ada tautan. Tambahkan tautan pertamamu.</div>';
    return;
  }

  list.innerHTML = currentLinks.map(link => `
    <div class="link-item">
      <div class="link-title">${escapeHTML(link.title)}</div>
      <div class="link-url">${escapeHTML(link.url)}</div>
      <div class="link-actions">
        <button class="secondary" type="button" data-edit="${escapeHTML(link.id)}">Edit</button>
        <button class="danger" type="button" data-delete="${escapeHTML(link.id)}">Hapus</button>
      </div>
    </div>
  `).join("");

  list.querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => editLink(button.dataset.edit));
  });

  list.querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => deleteLink(button.dataset.delete));
  });
}

$("linkForm").addEventListener("submit", async event => {
  event.preventDefault();

  const title = $("linkTitle").value.trim();
  const url = $("linkUrl").value.trim();

  if (!validHttpUrl(url)) {
    showMessage("Masukkan URL yang valid dengan awalan http:// atau https://.", "error");
    return;
  }

  const button = $("saveLinkBtn");
  button.disabled = true;
  button.textContent = "Menyimpan...";

  let result;

  if (editingLinkId) {
    result = await db.from("links")
      .update({ title, url, updated_at: new Date().toISOString() })
      .eq("id", editingLinkId)
      .eq("user_id", currentUser.id);
  } else {
    result = await db.from("links")
      .insert({
        user_id: currentUser.id,
        title,
        url,
        position: currentLinks.length,
        is_active: true
      });
  }

  button.disabled = false;
  button.textContent = editingLinkId ? "Simpan Perubahan" : "Tambah Link";

  if (result.error) {
    showMessage("Gagal menyimpan tautan: " + result.error.message, "error");
    return;
  }

  $("linkForm").reset();
  editingLinkId = null;
  $("saveLinkBtn").textContent = "Tambah Link";
  $("cancelEditBtn").style.display = "none";

  showMessage("Tautan berhasil disimpan!");
  await loadLinks();
});

function editLink(id) {
  const link = currentLinks.find(item => item.id === id);
  if (!link) return;

  editingLinkId = id;
  $("linkTitle").value = link.title;
  $("linkUrl").value = link.url;
  $("saveLinkBtn").textContent = "Simpan Perubahan";
  $("cancelEditBtn").style.display = "inline-block";
  $("linkTitle").focus();
}

$("cancelEditBtn").addEventListener("click", () => {
  editingLinkId = null;
  $("linkForm").reset();
  $("saveLinkBtn").textContent = "Tambah Link";
  $("cancelEditBtn").style.display = "none";
});

async function deleteLink(id) {
  const link = currentLinks.find(item => item.id === id);
  if (!link || !confirm(`Hapus tautan "${link.title}"?`)) return;

  const { error } = await db.from("links")
    .delete()
    .eq("id", id)
    .eq("user_id", currentUser.id);

  if (error) {
    showMessage("Gagal menghapus tautan: " + error.message, "error");
    return;
  }

  showMessage("Tautan berhasil dihapus.");
  await loadLinks();
}

async function loadLinks() {
  const { data, error } = await db.from("links")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("position", { ascending: true })
    .order("created_at", { ascending: true });

  if (error) {
    showMessage("Gagal memuat tautan: " + error.message, "error");
    return;
  }

  currentLinks = data || [];
  renderLinks();
}

$("previewBtn").addEventListener("click", () => {
  const username = $("username").value.trim().toLowerCase();

  if (!username) {
    showMessage("Isi username terlebih dahulu.", "error");
    return;
  }

  window.open("/" + encodeURIComponent(username) + "/", "_blank");
});

$("logoutBtn").addEventListener("click", async () => {
  $("logoutBtn").disabled = true;
  const { error } = await db.auth.signOut();

  if (error) {
    showMessage("Gagal logout: " + error.message, "error");
    $("logoutBtn").disabled = false;
    return;
  }

  window.location.replace("/login/");
});

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) {
    window.location.replace("/login/");
  }
});

init();
</script>
</body>
</html>
