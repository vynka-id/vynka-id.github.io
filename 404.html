<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080D1C">
<meta name="description" content="Digital identity powered by VYNKA.">
<title>VYNKA — Digital Identity</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  --bg:#080D1C;
  --surface:#14243D;
  --card:#172943;
  --text:#F4FAFF;
  --muted:#A9BCD1;
  --accent:#00E5FF;
  --border:#31506C;
  --glow:rgba(0,229,255,.15);
  --radius:12px;
  --font:Arial,sans-serif;

  margin:0;
  min-height:100vh;
  padding:35px 18px;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  display:flex;
  justify-content:center;
  transition:background .3s,color .3s;
}

/* 10 THEMES */

body[data-theme="nebula"]{
  --bg:#080D1C;--surface:#14243D;--card:#172943;
  --text:#F4FAFF;--muted:#A9BCD1;--accent:#00E5FF;
  --border:#31506C;--glow:rgba(0,229,255,.15);
  --radius:12px;
}

body[data-theme="santorini"]{
  --bg:#F7F5F0;--surface:#FFFFFF;--card:#FFFFFF;
  --text:#202B3C;--muted:#687487;--accent:#477B9E;
  --border:#DCE2E7;--glow:rgba(50,70,90,.07);
  --radius:13px;
}

body[data-theme="ocean"]{
  --bg:#071B33;--surface:#102B49;--card:#153859;
  --text:#F2FAFF;--muted:#A8C6DE;--accent:#48CAE4;
  --border:#326181;--glow:rgba(72,202,228,.16);
  --radius:15px;
}

body[data-theme="bloom"]{
  --bg:#FFF4F8;--surface:#FFFFFF;--card:#FFFFFF;
  --text:#442D42;--muted:#92788F;--accent:#D96AA5;
  --border:#F0D4E3;--glow:rgba(217,106,165,.12);
  --radius:22px;
}

body[data-theme="minimal"]{
  --bg:#F1F2F4;--surface:#FFFFFF;--card:#FFFFFF;
  --text:#17191D;--muted:#737982;--accent:#303640;
  --border:#D8DBE0;--glow:rgba(0,0,0,.06);
  --radius:8px;
}

body[data-theme="noir"]{
  --bg:#101010;--surface:#1C1C1C;--card:#242424;
  --text:#F8F3E9;--muted:#B7AD9C;--accent:#D6B56D;
  --border:#594B31;--glow:rgba(214,181,109,.18);
  --radius:3px;
}

body[data-theme="aurora"]{
  --bg:#17102D;--surface:#271B46;--card:#30204F;
  --text:#FFFFFF;--muted:#C8B9E5;--accent:#C084FC;
  --border:#694A91;--glow:rgba(192,132,252,.25);
  --radius:16px;
}

body[data-theme="cyber"]{
  --bg:#080B08;--surface:#141B13;--card:#182219;
  --text:#F1FFE9;--muted:#A7B69E;--accent:#B6FF00;
  --border:#45602C;--glow:rgba(182,255,0,.2);
  --radius:5px;
}

body[data-theme="emerald"]{
  --bg:#071C18;--surface:#102B24;--card:#16372D;
  --text:#F0FFF7;--muted:#A9C9BA;--accent:#36D399;
  --border:#315D4D;--glow:rgba(54,211,153,.2);
  --radius:10px;
}

body[data-theme="royal"]{
  --bg:#160F25;--surface:#241735;--card:#302044;
  --text:#FFF8EA;--muted:#C8B9D8;--accent:#E5BD69;
  --border:#665078;--glow:rgba(229,189,105,.22);
  --radius:14px;
}

/* BACKGROUND STYLES */

body[data-background="gradient"]{
  background:linear-gradient(145deg,var(--bg),var(--surface),var(--bg));
  background-attachment:fixed;
}

body[data-background="glow"]{
  background:radial-gradient(ellipse at top,var(--surface) 0%,var(--bg) 72%);
  background-attachment:fixed;
}

/* LAYOUT */

.container{
  width:100%;
  max-width:460px;
  text-align:center;
  position:relative;
}

.brand{
  font-size:25px;
  font-weight:900;
  letter-spacing:4px;
  color:var(--accent);
}

.brand span{color:var(--text)}

.profile{margin-top:42px}

.avatar{
  width:108px;
  height:108px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--accent);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:38px;
  font-weight:bold;
  color:var(--accent);
  box-shadow:0 8px 30px var(--glow);
}

.name{
  font-size:27px;
  font-weight:750;
  margin:0;
  overflow-wrap:anywhere;
}

.category{
  color:var(--accent);
  font-size:14px;
  margin-top:9px;
}

.bio{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin:17px auto 28px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.link{
  display:block;
  padding:16px 18px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  transition:.2s;
  overflow-wrap:anywhere;
  box-shadow:0 5px 20px var(--glow);
}

.link:hover{
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 8px 26px var(--glow);
}

.footer{
  margin-top:55px;
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

.footer a{
  color:var(--accent);
  text-decoration:none;
}

.status{
  margin-top:50px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.hidden{display:none!important}

/* CUSTOM FONT */

body[data-font="elegant"]{
  --font:Georgia,serif;
}

body[data-font="minimal"]{
  --font:Arial,sans-serif;
}

body[data-font="modern"]{
  --font:Inter,Arial,sans-serif;
}

/* BUTTON SHAPE */

body[data-button="square"]{
  --radius:3px;
}

body[data-button="rounded"]{
  --radius:12px;
}

body[data-button="pill"]{
  --radius:50px;
}

/* RESPONSIVE */

@media(max-width:480px){
  body{padding:28px 18px}
  .profile{margin-top:35px}
  .name{font-size:24px}
  .avatar{width:100px;height:100px}
}
</style>
</head>

<body data-theme="nebula" data-background="solid" data-button="rounded" data-font="modern">

<div class="container">

  <div class="brand">VYNKA<span>.</span></div>

  <div id="loading" class="status">
    Memuat identitas digital...
  </div>

  <div id="notFound" class="status hidden">
    <h2>Profil tidak ditemukan</h2>
    <p>Username ini belum terdaftar atau profil belum dipublikasikan.</p>
    <a href="/" style="color:var(--accent)">Kembali ke VYNKA</a>
  </div>

  <div id="profile" class="profile hidden">

    <div id="avatar" class="avatar">V</div>

    <h1 id="name" class="name"></h1>

    <div id="category" class="category"></div>

    <div id="bio" class="bio"></div>

    <div id="links" class="links"></div>

  </div>

  <div class="footer">
    Powered by <a href="/">VYNKA</a><br>
    One Identity. Infinite Connections.
  </div>

</div>

<script>
const SUPABASE_URL="https://oasivryuvwpzxezrngej.supabase.co";
const SUPABASE_KEY="sb_publishable_OyWy9aYFSJolvJxNcucMXA_bWPS2N-a";

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* TEMA YANG DIIZINKAN */

const validThemes=[
  "nebula",
  "santorini",
  "ocean",
  "bloom",
  "minimal",
  "noir",
  "aurora",
  "cyber",
  "emerald",
  "royal"
];

const validButtonShapes=[
  "square",
  "rounded",
  "pill"
];

const validBackgrounds=[
  "solid",
  "gradient",
  "glow"
];

const validFonts=[
  "modern",
  "elegant",
  "minimal"
];

/* UTILITIES */

function showNotFound(){
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("profile").classList.add("hidden");
  document.getElementById("notFound").classList.remove("hidden");
}

function safeUrl(value){
  try{
    const url=new URL(value);

    if(url.protocol==="https:"||url.protocol==="http:"){
      return url.href;
    }
  }catch{}

  return null;
}

function validHexColor(value){
  return typeof value==="string"&&
    /^#[0-9a-fA-F]{6}$/.test(value);
}

function createInitial(name){
  const div=document.createElement("div");

  div.className="avatar";
  div.textContent=name.trim().charAt(0).toUpperCase()||"V";

  return div;
}

/* APPLY APPEARANCE */

function applyAppearance(profile){

  // Tema
  const theme=validThemes.includes(profile.theme)
    ?profile.theme
    :"nebula";

  document.body.dataset.theme=theme;

  // Warna aksen custom
  if(validHexColor(profile.accent_color)){
    document.body.style.setProperty(
      "--accent",
      profile.accent_color
    );
  }else{
    document.body.style.removeProperty("--accent");
  }

  // Bentuk tombol
  const buttonShape=validButtonShapes.includes(profile.button_shape)
    ?profile.button_shape
    :"rounded";

  document.body.dataset.button=buttonShape;

  // Background
  const background=validBackgrounds.includes(profile.background_style)
    ?profile.background_style
    :"solid";

  document.body.dataset.background=background;

  // Font
  const font=validFonts.includes(profile.font_style)
    ?profile.font_style
    :"modern";

  document.body.dataset.font=font;

  // Warna browser
  const bg=getComputedStyle(document.body)
    .getPropertyValue("--bg").trim();

  document.querySelector('meta[name="theme-color"]').content=bg;
}

/* LOAD PROFILE */

async function loadProfile(){

  const parts=window.location.pathname
    .split("/")
    .filter(Boolean);

  // Hanya satu segmen URL yang dianggap username.
  if(parts.length!==1){
    showNotFound();
    return;
  }

  let username;

  try{
    username=decodeURIComponent(parts[0]).toLowerCase();
  }catch{
    showNotFound();
    return;
  }

  if(!/^[a-z0-9-]{3,30}$/.test(username)){
    showNotFound();
    return;
  }

  // Ambil profil dan pengaturan tampilan.
  const {data:profile,error}=await db
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      category,
      bio,
      avatar_url,
      theme,
      accent_color,
      button_shape,
      background_style,
      font_style
    `)
    .eq("username",username)
    .eq("is_published",true)
    .maybeSingle();

  if(error||!profile){
    console.error("Profile error:",error);
    showNotFound();
    return;
  }

  // Terapkan tema dan custom appearance.
  applyAppearance(profile);

  // Informasi profil.
  const displayName=profile.display_name||profile.username;

  document.title=`${displayName} | VYNKA`;

  document.getElementById("name").textContent=displayName;

  document.getElementById("category").textContent=
    profile.category||"";

  document.getElementById("bio").textContent=
    profile.bio||"";

  // Foto profil.
  const avatar=document.getElementById("avatar");

  const avatarUrl=profile.avatar_url
    ?safeUrl(profile.avatar_url)
    :null;

  if(avatarUrl){

    const image=document.createElement("img");

    image.src=avatarUrl;
    image.alt="Foto profil";
    image.className="avatar";

    image.onerror=()=>{
      image.replaceWith(createInitial(displayName));
    };

    avatar.replaceWith(image);

  }else{

    avatar.textContent=
      displayName.trim().charAt(0).toUpperCase()||"V";
  }

  // Ambil link aktif milik pengguna.
  const {data:links,error:linkError}=await db
    .from("links")
    .select("title,url")
    .eq("user_id",profile.id)
    .eq("is_active",true)
    .order("position",{ascending:true});

  if(linkError){
    console.error("Links error:",linkError);
    showNotFound();
    return;
  }

  const linkContainer=document.getElementById("links");

  linkContainer.replaceChildren();

  (links||[]).forEach(link=>{

    const url=safeUrl(link.url);

    if(!url)return;

    const anchor=document.createElement("a");

    anchor.className="link";
    anchor.href=url;
    anchor.target="_blank";
    anchor.rel="noopener noreferrer";
    anchor.textContent=link.title||"Buka Link";

    linkContainer.appendChild(anchor);
  });

  // Tampilkan profil.
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("profile").classList.remove("hidden");
}

/* ERROR HANDLING */

loadProfile().catch(error=>{
  console.error("VYNKA profile error:",error);
  showNotFound();
});
</script>

</body>
</html>
```
