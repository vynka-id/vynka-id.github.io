<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vynka</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app"><p class="m c">Memuat…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/vynka.js"></script>
<script>
// GitHub Pages menyajikan file ini untuk setiap path yang tidak ada, misalnya /budi
(async()=>{
  const tidakAda=()=>app.replaceChildren(el("p",{className:"m c",textContent:"Halaman tidak ditemukan."}), el("p",{className:"c"}, el("a",{className:"back",href:"/",textContent:"Buat halaman Vynka kamu"})));
  let u=""; try{ u=decodeURIComponent(location.pathname.split("/").filter(Boolean)[0]||"").toLowerCase(); }catch(e){}
  if(!/^[a-z0-9_]{3,30}$/.test(u)) return tidakAda();
  const {data:p}=await sb.from("profiles").select("*").eq("username",u).maybeSingle();
  if(!p) return tidakAda();
  document.title=(p.display_name||p.username)+" · Vynka";
  sb.auth.getSession().then(({data:{session}})=>{ if(!session||session.user.id!==p.id) sb.rpc("increment_view",{uname:u}); });
  const {data:ls}=await sb.from("links").select("*").eq("user_id",p.id).order("position");
  const box=el("div"); app.replaceChildren(box);
  renderPublik(box,p,ls||[],{track:l=>sb.rpc("increment_click",{link_id:l.id})});
})();
</script>
</body>
</html>
