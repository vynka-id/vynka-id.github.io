<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vynka</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%237c3aed%22/%3E%3Cstop offset=%22.55%22 stop-color=%22%23ec4899%22/%3E%3Cstop offset=%221%22 stop-color=%22%23f59e0b%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2248%22 height=%2248%22 rx=%2212%22 fill=%22url(%23g)%22/%3E%3Cg transform=%22translate(19 25) rotate(-22)%22%3E%3Crect x=%22-3.6%22 y=%22-14%22 width=%227.2%22 height=%2228%22 rx=%223.6%22 fill=%22%23fff%22/%3E%3C/g%3E%3Cg transform=%22translate(29 25) rotate(22)%22%3E%3Crect x=%22-3.6%22 y=%22-14%22 width=%227.2%22 height=%2228%22 rx=%223.6%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.6%22/%3E%3C/g%3E%3Cpath d=%22M41 5 L42 7 L44 8 L42 9 L41 11 L40 9 L38 8 L40 7 Z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap" id="app"><p class="m c">Memuat…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/vynka.js"></script>
<script>
// GitHub Pages menyajikan file ini untuk setiap path yang tidak ada, misalnya /budi
(async()=>{
  const id_=(()=>{ try{ return localStorage.getItem("vynka_lang")==="id"; }catch(e){ return false; } })();
  const tidakAda=()=>app.replaceChildren(el("p",{className:"m c",textContent:id_?"Halaman tidak ditemukan.":"Page not found."}), el("p",{className:"c"}, el("a",{className:"back",href:"/",textContent:id_?"Buat halaman Vynka kamu":"Create your own Vynka page"})));
  let u=""; try{ u=decodeURIComponent(location.pathname.split("/").filter(Boolean)[0]||"").toLowerCase(); }catch(e){}
  if(!/^[a-z0-9_]{3,30}$/.test(u)) return tidakAda();
  const {data:p}=await sb.from("profiles").select("*").eq("username",u).maybeSingle();
  if(!p) return tidakAda();
  document.title=p.seo_title||((p.display_name||p.username)+" · Vynka");
  const mt=(n,v,a)=>{ let m=document.querySelector("meta["+a+'="'+n+'"]'); if(!m){ m=document.createElement("meta"); m.setAttribute(a,n); document.head.append(m); } m.content=v; };
  const dsc=p.seo_desc||p.bio||""; mt("description",dsc,"name"); mt("og:title",document.title,"property"); mt("og:description",dsc,"property"); document.body.dataset.tema=TEMA[p.tema]?p.tema:"klasik";
  const rf=(()=>{ try{ const h=new URL(document.referrer).hostname.replace(/^www\./,""); if(!h||h===location.hostname) return "direct"; const k=["instagram","tiktok","youtube","facebook","twitter","t.co","whatsapp","google","linkedin","telegram","threads"].find(x=>h.includes(x)); return (k==="t.co"||k==="twitter")?"x":(k||h); }catch(e){ return "direct"; } })();
  const dv=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"mobile":"desktop";
  sb.auth.getSession().then(({data:{session}})=>{ if(!session||session.user.id!==p.id) sb.rpc("track_view",{uname:u,r:rf,d:dv}).then(r=>{ if(r.error) sb.rpc("increment_view",{uname:u}); }); });
  const {data:ls}=await sb.from("links").select("*").eq("user_id",p.id).order("position");
  app.className="pgwrap"; const box=el("div"); app.replaceChildren(box);
  renderPublik(box,p,ls||[],{track:l=>sb.rpc("track_click",{link_id:l.id,r:rf,d:dv}).then(r=>{ if(r.error) sb.rpc("increment_click",{link_id:l.id}); })});
  { const bv=box.style.getPropertyValue("--pbg"); if(bv) document.body.style.setProperty("--pbg",bv); }
})();
</script>
</body>
</html>
